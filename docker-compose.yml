services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-advisory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-advisory}
      POSTGRES_DB: ${POSTGRES_DB:-advisory_platform}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-advisory}']
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        (until echo "s3.configure -access_key $${SEAWEEDFS_S3_ACCESS_KEY} -secret_key $${SEAWEEDFS_S3_SECRET_KEY} -user advisory-api -actions Read,Write,List,Tagging,Admin -apply" | weed shell -master=localhost:9333 >/dev/null; do sleep 1; done) & exec weed server -dir=/data -s3 -s3.port=8333
    environment:
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-seaweedfsadmin}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:-seaweedfsadmin}
    ports:
      - '8333:8333'
      - '8888:8888'
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:
