name: Verify that the code runs, pass lint, pass unit test, pass e2e test, and get code coverage

on:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisory
          POSTGRES_PASSWORD: advisory
          POSTGRES_DB: advisory_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        env:
          SEAWEEDFS_S3_ACCESS_KEY: seaweedfsadmin
          SEAWEEDFS_S3_SECRET_KEY: seaweedfsadmin
        ports:
          - 8333:8333
    env:
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3001
      POSTGRES_USER: advisory
      POSTGRES_DB: advisory_platform
      SEAWEEDFS_S3_ENDPOINT: localhost
      SEAWEEDFS_S3_PORT: 8333
      SEAWEEDFS_S3_USE_SSL: false
      SEAWEEDFS_S3_ACCESS_KEY: seaweedfsadmin
      SEAWEEDFS_S3_BUCKET: advisory-platform
      SEAWEEDFS_S3_REGION: us-east-1

      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEAWEEDFS_S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        name: Install pnpm
        with:
          version: 11
          cache: true
      - run: pnpm run db:migrate
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:cov
        env:
          OMISE_SECRET_KEY: ${{ secrets.OMISE_SECRET_KEY }}
          OMISE_PUBLIC_KEY: ${{ secrets.OMISE_PUBLIC_KEY }}