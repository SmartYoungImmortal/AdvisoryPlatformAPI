name: Verify that the code runs, pass lint, pass unit test, pass e2e test, and get code coverage

on:
  workflow_call:
    secrets:
      BETTER_AUTH_SECRET:
        required: true
      POSTGRES_PASSWORD:
        required: true
      SEAWEEDFS_S3_SECRET_KEY:
        required: true
      OMISE_SECRET_KEY:
        required: true
      OMISE_PUBLIC_KEY:
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisory
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: advisory_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        env:
          SEAWEEDFS_S3_ACCESS_KEY: seaweedfsaccess
          SEAWEEDFS_S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}
        ports:
          - 8333:8333
    env:
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3001
      POSTGRES_USER: advisory
      POSTGRES_DB: advisory_platform
      # CI verifies the code against the throwaway service container above, never against
      # Supabase. Deriving the URL from that container — rather than reading a DATABASE_URL
      # secret — is what makes it impossible for a future edit of that secret to point the
      # destructive suites at shared data.
      TEST_DATABASE_URL: postgresql://advisory:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/advisory_platform
      SEAWEEDFS_S3_ENDPOINT: localhost
      SEAWEEDFS_S3_PORT: 8333
      SEAWEEDFS_S3_USE_SSL: false
      SEAWEEDFS_S3_ACCESS_KEY: seaweedfsaccess
      SEAWEEDFS_S3_BUCKET: advisory-platform
      SEAWEEDFS_S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b
        name: Install pnpm
        with:
          version: 11
          cache: true

      # Brings the service container up to the current schema. Migrating Supabase is a
      # deliberate act run by a person, not something a pull request does on its way past.
      - run: pnpm run db:migrate
        name: Migrate the test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - run: pnpm run build

      - run: pnpm run lint

      - run: pnpm run test:cov
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # The unit suite boots modules that validate DATABASE_URL, and the destructive
          # suites overwrite it from TEST_DATABASE_URL in test/setup-test-env.ts. Both
          # point at the service container either way.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          SEAWEEDFS_S3_SECRET_KEY: ${{ secrets.SEAWEEDFS_S3_SECRET_KEY }}
          OMISE_SECRET_KEY: ${{ secrets.OMISE_SECRET_KEY }}
          OMISE_PUBLIC_KEY: ${{ secrets.OMISE_PUBLIC_KEY }}
