name: CI

on:
  push:
    branches: [main, develop, UAT]
  pull_request:
    branches: [main, develop, UAT]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisory
          POSTGRES_PASSWORD: advisory
          POSTGRES_DB: advisory_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        env:
          SEAWEEDFS_S3_ACCESS_KEY: seaweedfsadmin
          SEAWEEDFS_S3_SECRET_KEY: seaweedfsadmin
        ports:
          - 8333:8333
    env:
      DATABASE_URL: postgresql://advisory:advisory@localhost:5432/advisory_platform
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3001
      POSTGRES_USER: advisory
      POSTGRES_PASSWORD: advisory
      POSTGRES_DB: advisory_platform
      SEAWEEDFS_S3_ENDPOINT: localhost
      SEAWEEDFS_S3_PORT: 8333
      SEAWEEDFS_S3_USE_SSL: false
      SEAWEEDFS_S3_ACCESS_KEY: seaweedfsadmin
      SEAWEEDFS_S3_SECRET_KEY: seaweedfsadmin
      SEAWEEDFS_S3_BUCKET: advisory-platform
      SEAWEEDFS_S3_REGION: us-east-1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          cache: true
      - name: Install dependencies
        run: pnpm install
      - run: pnpm run db:migrate
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run test:cov
