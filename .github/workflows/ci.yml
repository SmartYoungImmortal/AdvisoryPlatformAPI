name: CI

on:
  push:
    branches: [main, develop, UAT]
  pull_request:
    branches: [main, develop, UAT]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advisory
          POSTGRES_PASSWORD: advisory
          POSTGRES_DB: advisory_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advisory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://advisory:advisory@localhost:5432/advisory_platform
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://localhost:3001
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: false
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: advisory-platform

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          docker run -d --name minio
          -e MINIO_ROOT_USER=minioadmin
          -e MINIO_ROOT_PASSWORD=minioadmin
          -p 9000:9000
          minio/minio:latest server /data
      - run: curl --retry 10 --retry-connrefused --retry-delay 1 http://localhost:9000/minio/health/live
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run lint
      - run: npm run test:cov
