name: Deploy the API to Cloud Run

# Called from ci.yml once `verify` has passed on a push, or run by hand from the Actions tab.
# The branch picks the GitHub Environment — main → production, UAT → uat, anything else → qa —
# and each Environment carries its own project, service and public settings as variables, so
# one file serves every stage. docs/DEPLOY.md lists the variables and the one-time GCP setup.
#
# This workflow does not migrate Supabase. Running `pnpm db:migrate` against the shared
# database stays a deliberate step a person takes, the same rule verify.yml follows.

on:
  workflow_call:
  workflow_dispatch:

# Two pushes in a row must not race each other onto the same service.
concurrency:
  group: deploy-cloud-run-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'UAT' && 'uat' || 'qa' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      # Workload Identity Federation: GitHub's OIDC token is exchanged for a short-lived
      # Google credential, so no service-account key is stored anywhere.
      id-token: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      # Cloud Run pulls only from Artifact Registry or Docker Hub, so the GHCR image that
      # build-container.yml publishes cannot be reused here. Cloud Run also runs amd64 only.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=cloud-run
          cache-to: type=gha,scope=cloud-run,mode=max

      # The deploy action splits env_vars on commas, and TRUSTED_ORIGINS is a comma-separated
      # list, so its commas are escaped before it is handed over.
      - name: Escape the trusted origins
        env:
          TRUSTED_ORIGINS: ${{ vars.TRUSTED_ORIGINS }}
        run: echo "TRUSTED_ORIGINS_ESCAPED=${TRUSTED_ORIGINS//,/\\,}" >> "$GITHUB_ENV"

      # PORT is not set: Cloud Run injects it and the app already reads it.
      # Session affinity and the long timeout keep a Socket.IO chat on one instance.
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --allow-unauthenticated
            --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
            --session-affinity
            --timeout=3600
            --min-instances=0
            --max-instances=${{ vars.CLOUD_RUN_MAX_INSTANCES || '2' }}
          env_vars: |-
            NODE_ENV=production
            BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }}
            TRUSTED_ORIGINS=${{ env.TRUSTED_ORIGINS_ESCAPED }}
            CURRENCY_CODE=${{ vars.CURRENCY_CODE || 'thb' }}
            SEAWEEDFS_S3_ENDPOINT=${{ vars.SEAWEEDFS_S3_ENDPOINT }}
            SEAWEEDFS_S3_PORT=${{ vars.SEAWEEDFS_S3_PORT }}
            SEAWEEDFS_S3_USE_SSL=${{ vars.SEAWEEDFS_S3_USE_SSL }}
            SEAWEEDFS_S3_BUCKET=${{ vars.SEAWEEDFS_S3_BUCKET }}
            SEAWEEDFS_S3_REGION=${{ vars.SEAWEEDFS_S3_REGION }}
          env_vars_update_strategy: overwrite
          # Values live in Secret Manager; only their names appear here.
          secrets: |-
            DATABASE_URL=${{ vars.SECRET_PREFIX }}-database-url:latest
            BETTER_AUTH_SECRET=${{ vars.SECRET_PREFIX }}-better-auth-secret:latest
            OMISE_PUBLIC_KEY=${{ vars.SECRET_PREFIX }}-omise-public-key:latest
            OMISE_SECRET_KEY=${{ vars.SECRET_PREFIX }}-omise-secret-key:latest
            SEAWEEDFS_S3_ACCESS_KEY=${{ vars.SECRET_PREFIX }}-seaweedfs-access-key:latest
            SEAWEEDFS_S3_SECRET_KEY=${{ vars.SECRET_PREFIX }}-seaweedfs-secret-key:latest
          secrets_update_strategy: overwrite

      # better-auth answers /api/auth/ok without touching the database, so a failure here
      # means the container did not boot, not that Supabase is slow.
      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 30 "${{ steps.deploy.outputs.url }}/api/auth/ok"
