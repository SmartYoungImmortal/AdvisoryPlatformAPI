# ─── SonarCloud (Automatic Analysis) ─────────────────────────────────
# Automatic Analysis reads this file and ignores sonar-project.properties, so
# the scope has to be set here. It takes the scope settings only: the per-rule
# exclusions in sonar-project.properties do not reach it, and a line that one of
# those rules flags carries a NOSONAR with the reason instead.
sonar.sourceEncoding=UTF-8

# Keep integration harnesses classified as tests rather than production code.
sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=src/**/*.spec.ts,test/**/*

# src/database/migrations: SQL that drizzle-kit generates and that is already
# applied; editing it would change history, not code. Sonar also reads it as
# Oracle PL/SQL (VARCHAR2, quoted identifiers), which is the wrong dialect for
# Postgres, so every finding there is noise.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/database/migrations/**

# The seed out of copy-paste detection only (every rule still runs on it): its
# demo data is tables of records with one shape, and duplication detection
# ignores the literal values, so each record reads as a copy of the one before.
sonar.cpd.exclusions=src/database/seed.ts
