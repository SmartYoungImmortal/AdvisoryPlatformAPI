# ─── SonarCloud ──────────────────────────────────────────────────────
# SonarCloud scans the repo itself on every push (Automatic Analysis), and that
# scan reads .sonarcloud.properties, not this file. This one is for a scanner
# run in CI: it says what not to scan and which rules do not apply where. The
# PR comment comes from .github/workflows/sonar-report.yml.
sonar.sourceEncoding=UTF-8

# ─── Exclusions ──────────────────────────────────────────────────────
# src/database/migrations: SQL that drizzle-kit generates and that is already
# applied; editing it would change history, not code. Sonar also reads it as
# Oracle PL/SQL (VARCHAR2, quoted identifiers), which is the wrong dialect for
# Postgres, so every finding there is noise.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,src/database/migrations/**,src/database/migrations/**/*

# The seed out of copy-paste detection only (every rule still runs on it): its
# demo data is tables of records with one shape, and duplication detection
# ignores the literal values, so each record reads as a copy of the one before.
sonar.cpd.exclusions=src/database/seed.ts

# ─── Rules scoped to where they do not fit ───────────────────────────
sonar.issue.ignore.multicriteria=seedLoop,testLoop,storageProofLoop,seedComplexity,seedPassword

# S9382 (await in a loop): the seed and the e2e set-up insert rows one after
# another on purpose (foreign keys, unique keys, "find or create" by name),
# and against the shared pool, so running them all at once is not the fix.
sonar.issue.ignore.multicriteria.seedLoop.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.seedLoop.resourceKey=src/database/seed.ts
sonar.issue.ignore.multicriteria.testLoop.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.testLoop.resourceKey=test/**/*
# This opt-in proof serializes large uploads and dependent room cleanup.
sonar.issue.ignore.multicriteria.storageProofLoop.ruleKey=javascript:S9382
sonar.issue.ignore.multicriteria.storageProofLoop.resourceKey=test/storage-live-proof.cjs

# S3776 (cognitive complexity) in the seed: a one-off script that writes the
# demo data top to bottom, run by hand against a shared database. Splitting
# it changes nothing at runtime and cannot be checked without re-seeding.
sonar.issue.ignore.multicriteria.seedComplexity.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.seedComplexity.resourceKey=src/database/seed.ts

# S2068 (hard-coded password) in the seed: the one shared password of the demo
# accounts it creates, which exist only in a seeded database and are meant to
# be signed in with. No real account's credential lives in code.
sonar.issue.ignore.multicriteria.seedPassword.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.seedPassword.resourceKey=src/database/seed.ts
